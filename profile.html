<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile - UNILIBRY</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#f0f2f5}
.top{background:#0a3d62;color:white;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.top a{color:#ffdd57;text-decoration:none;margin-left:10px;font-weight:bold}
.cover{height:200px;background:linear-gradient(135deg,#667eea,#764ba2);position:relative;background-size:cover;background-position:center}
.avatarWrap{position:absolute;bottom:-50px;left:16px;display:flex;align-items:end;gap:10px}
.avatar{width:110px;height:110px;border-radius:50%;border:4px solid white;object-fit:cover;background:white}
.btn{background:white;color:#0a3d62;border:none;padding:7px 14px;border-radius:20px;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.card{max-width:700px;margin:70px auto 20px;background:white;border-radius:16px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;margin:6px 0}
.save{background:#0a3d62;color:white;width:100%;padding:12px;border-radius:25px;border:none;font-weight:bold;cursor:pointer;margin-top:8px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.gallery img{width:100%;height:100px;object-fit:cover;border-radius:10px}
#status{font-size:13px;color:green;margin-top:6px}
</style></head><body>
<div class="top"><b>UNILIBRY</b><div><a href="connect.html">Connect</a><a href="index.html">Library</a></div></div>
<div class="cover" id="coverDiv">
<div class="avatarWrap"><img id="avatarImg" class="avatar" src="https://via.placeholder.com/110?text=You"><button class="btn" onclick="document.getElementById('avFile').click()">Change Pic</button></div>
<button class="btn" style="position:absolute;right:12px;bottom:12px" onclick="document.getElementById('cvFile').click()">Change Cover</button>
</div>

<div class="card">
<h3 id="dName">Your Profile</h3>
<p id="dSchool" style="color:gray;margin-top:-10px"></p>
<input id="nameInput" placeholder="Your Name - e.g Musa">
<input id="schoolInput" placeholder="School - e.g UniJos Computer Science">
<textarea id="bioInput" placeholder="Your Bio"></textarea>
<input type="file" id="avFile" accept="image/*" hidden>
<input type="file" id="cvFile" accept="image/*" hidden>
<input type="file" id="galFile" accept="image/*" hidden>
<button class="save" onclick="saveProfile()" id="saveBtn">Save Profile</button>
<p id="status"></p>

<h4>📸 My Gallery <button class="btn" style="font-size:12px" onclick="document.getElementById('galFile').click()">+ Add Picture</button></h4>
<div class="gallery" id="galDiv"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB... YOUR REAL KEY HERE",
  authDomain: "unilibry.firebaseapp.com",
  projectId: "unilibry",
  storageBucket: "unilibry.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};

const app=initializeApp(firebaseConfig); const db=getFirestore(app); const storage=getStorage(app);
const nameInput=document.getElementById('nameInput'), schoolInput=document.getElementById('schoolInput'), bioInput=document.getElementById('bioInput'), avatarImg=document.getElementById('avatarImg'), coverDiv=document.getElementById('coverDiv'), statusP=document.getElementById('status');

nameInput.value=localStorage.getItem('unilibry_name')||'';
let currentUrls={avatar:'', cover:'', gallery:[]};

async function load(){
  const name=nameInput.value.trim()||localStorage.getItem('unilibry_name');
  if(!name) return;
  try{
    const snap=await getDoc(doc(db,'profiles',name));
    if(snap.exists()){
      const p=snap.data();
      document.getElementById('dName').textContent=p.name||name;
      document.getElementById('dSchool').textContent=p.school||'';
      nameInput.value=p.name||''; schoolInput.value=p.school||''; bioInput.value=p.bio||'';
      if(p.avatar){ avatarImg.src=p.avatar; currentUrls.avatar=p.avatar; }
      if(p.cover){ coverDiv.style.backgroundImage=`url(${p.cover})`; currentUrls.cover=p.cover; }
      if(p.gallery){ currentUrls.gallery=p.gallery; renderGallery(p.gallery); }
    }
  }catch(e){ console.log(e); statusP.textContent='Error: '+e.message; }
}
load();

function renderGallery(arr){ document.getElementById('galDiv').innerHTML=arr.map(u=>`<img src="${u}">`).join(''); }

async function uploadFile(file, path){
  statusP.textContent='Uploading '+file.name+'...';
  const r=ref(storage, path);
  await uploadBytes(r, file);
  const url=await getDownloadURL(r);
  statusP.textContent='Uploaded ✅';
  return url;
}

document.getElementById('avFile').onchange=async(e=>{
  const file=e.target.files[0]; if(!file)return;
  try{ const url=await uploadFile(file,'profiles/avatar_'+Date.now()+'_'+file.name); avatarImg.src=url; currentUrls.avatar=url; statusP.textContent='Profile pic changed! Click Save Profile now'; }catch(err){ alert('Upload failed: '+err.message+' - Make sure you enabled Storage'); statusP.textContent=err.message; }
});
document.getElementById('cvFile').onchange=async(e=>{
  const file=e.target.files[0]; if(!file)return;
  try{ const url=await uploadFile(file,'profiles/cover_'+Date.now()+'_'+file.name); coverDiv.style.backgroundImage=`url(${url})`; currentUrls.cover=url; statusP.textContent='Cover changed! Click Save Profile now'; }catch(err){ alert('Upload failed: '+err.message); }
});
document.getElementById('galFile').onchange=async(e=>{
  const file=e.target.files[0]; if(!file)return;
  try{ const url=await uploadFile(file,'profiles/gallery_'+Date.now()+'_'+file.name); currentUrls.gallery.unshift(url); renderGallery(currentUrls.gallery); statusP.textContent='Gallery pic added! Click Save Profile'; }catch(err){ alert(err.message); }
});

window.saveProfile=async()=>{
  const name=nameInput.value.trim(); if(!name){alert('Put name');return;}
  localStorage.setItem('unilibry_name',name);
  statusP.textContent='Saving...';
  try{
    await setDoc(doc(db,'profiles',name),{
      name,
      school:schoolInput.value.trim(),
      bio:bioInput.value.trim(),
      avatar:currentUrls.avatar||'',
      cover:currentUrls.cover||'',
      gallery:currentUrls.gallery||[],
      updatedAt:serverTimestamp()
    },{merge:true});
    statusP.textContent='Saved! ✅ Refresh Connect to see your pic';
    document.getElementById('dName').textContent=name;
    document.getElementById('dSchool').textContent=schoolInput.value;
  }catch(e){ statusP.textContent='Error: '+e.message; alert(e.message); }
};
</script></body></html>
