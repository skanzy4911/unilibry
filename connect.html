<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNILIBRY Connect - All Schools Live</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.header{background:#0a3d62;color:white;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.header a{color:#ffdd57;text-decoration:none;margin:0 10px}
.box{max-width:700px;margin:20px auto;background:white;padding:20px;border-radius:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
textarea{width:100%;height:80px;border-radius:10px;padding:12px;border:1px solid #ccc;resize:none;font-size:16px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:10px 0;font-size:16px;box-sizing:border-box}
button{background:#0a3d62;color:white;border:none;padding:12px 25px;border-radius:25px;font-weight:bold;cursor:pointer;width:100%;font-size:16px}
.post{border-bottom:1px solid #eee;padding:15px 0}
.post b{color:#0a3d62}
.time{font-size:12px;color:gray}
</style>
</head>
<body>
<div class="header">
  <b>UNILIBRY Connect 🌍</b> | 
  <a href="index.html">📚 Library</a>
  <a href="connect.html">💬 Live Feed</a>
</div>

<div class="box">
  <h3>Share to All Universities 🎓</h3>
  <input id="nameInput" placeholder="Your name & school e.g. David - UniJos">
  <textarea id="postInput" placeholder="Wetin you wan share? Question, note, gist..."></textarea>
  <button onclick="makePost()">Post to All Schools 🚀</button>
</div>

<div class="box" id="feedBox">
  <h3>🔴 Live Feed - All Schools</h3>
  <div id="feed">Loading posts...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9H0...PUT_YOUR_FULL_KEY_HERE",
  authDomain: "unilibry.firebaseapp.com",
  projectId: "unilibry",
  storageBucket: "unilibry.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const nameInput = document.getElementById('nameInput');
const postInput = document.getElementById('postInput');
const feedDiv = document.getElementById('feed');

// remember name
nameInput.value = localStorage.getItem('unilibry_name') || '';

window.makePost = async () => {
  const name = nameInput.value.trim();
  const text = postInput.value.trim();
  if(!name){ alert('Put your name & school first'); return; }
  if(!text){ alert('Write something to post'); return; }
  localStorage.setItem('unilibry_name', name);
  try{
    await addDoc(collection(db, "connect_posts"), { name, text, createdAt: serverTimestamp() });
    postInput.value = '';
  }catch(e){ alert('Error: '+e.message); }
};

// live feed
const q = query(collection(db, "connect_posts"), orderBy("createdAt", "desc"));
onSnapshot(q, (snap)=>{
  if(snap.empty){ feedDiv.innerHTML = '<p>No posts yet. Be first!</p>'; return; }
  let html='';
  snap.forEach(doc=>{
    const d=doc.data();
    const time = d.createdAt ? d.createdAt.toDate().toLocaleString() : 'now';
    html+=`<div class="post"><b>${d.name}</b><br>${d.text}<br><span class="time">${time}</span></div>`;
  });
  feedDiv.innerHTML=html;
});
</script>
</body>
</html>
